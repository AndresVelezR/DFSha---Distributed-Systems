# Clúster local de DFSha: 1 ControlNode y 3 DataNodes en una red privada.
# Los parámetros operativos se pueden cambiar sin recompilar, por ejemplo:
#   REPLICATION_FACTOR=1 docker compose up -d
# o dejándolos en un archivo .env junto a este archivo.

x-cluster-env: &cluster-env
  CLUSTER_KEY: dev-cluster-key
  HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-3}

x-datanode: &datanode
  build:
    context: .
    dockerfile: docker/datanode.Dockerfile
  depends_on: [controlnode]
  networks: [dfsha]

services:
  controlnode:
    build:
      context: .
      dockerfile: docker/controlnode.Dockerfile
    environment:
      <<: *cluster-env
      NODE_ID: cn-01
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-2}
      BLOCK_SIZE_MIN_MB: ${BLOCK_SIZE_MIN_MB:-8}
      BLOCK_SIZE_MAX_MB: ${BLOCK_SIZE_MAX_MB:-64}
      BLOCKS_PER_NODE: ${BLOCKS_PER_NODE:-4}
      HEARTBEAT_MISSES: ${HEARTBEAT_MISSES:-3}
      WRITE_LEASE_TTL_SECONDS: ${WRITE_LEASE_TTL_SECONDS:-60}
    ports:
      - "8000:8000"
    networks: [dfsha]

  dn1:
    <<: *datanode
    environment:
      <<: *cluster-env
      NODE_ID: dn-01
      ADVERTISE_HOST: dn1
      PORT: 8001
      CONTROL_URL: http://controlnode:8000
      STORAGE_DIR: /data
    volumes: [dn1:/data]

  dn2:
    <<: *datanode
    environment:
      <<: *cluster-env
      NODE_ID: dn-02
      ADVERTISE_HOST: dn2
      PORT: 8001
      CONTROL_URL: http://controlnode:8000
      STORAGE_DIR: /data
    volumes: [dn2:/data]

  dn3:
    <<: *datanode
    environment:
      <<: *cluster-env
      NODE_ID: dn-03
      ADVERTISE_HOST: dn3
      PORT: 8001
      CONTROL_URL: http://controlnode:8000
      STORAGE_DIR: /data
    volumes: [dn3:/data]

  # Cuarto DataNode, apagado por defecto. Sirve para demostrar que un nodo se
  # agrega con el clúster en marcha, sin reiniciar ni reconfigurar nada
  # (Hito 1, vm-04): docker compose --profile scale up -d dn4
  dn4:
    <<: *datanode
    profiles: [scale]
    environment:
      <<: *cluster-env
      NODE_ID: dn-04
      ADVERTISE_HOST: dn4
      PORT: 8001
      CONTROL_URL: http://controlnode:8000
      STORAGE_DIR: /data
    volumes: [dn4:/data]

  # Herramienta de línea de comandos, no un servicio: se usa con
  # "docker compose run --rm client <comando>" con el clúster ya levantado.
  # No declara depends_on para no volver a encender un DataNode que se
  # detuvo a propósito (por ejemplo, en la prueba de tolerancia a fallos).
  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    environment:
      DFSHA_CONTROL: http://controlnode:8000
      HOME: /tmp
    networks: [dfsha]
    profiles: [tools]

volumes:
  dn1:
  dn2:
  dn3:
  dn4:

networks:
  dfsha:
    driver: bridge
