# Un ControlNode y un DataNode por máquina virtual. Se ejecuta en cada VM desde
# la raíz del repositorio, cada una con su archivo de configuración:
#   docker compose --env-file deploy/aws/vm1.env -f deploy/aws/compose.yml up -d --build
# Para una VM que solo agrega un DataNode, terminar el comando con "data".

x-security: &security
  TLS_CERT: /secrets/cluster.crt
  TLS_KEY: /secrets/cluster.key
  TLS_CA: /secrets/ca.crt
  CLUSTER_KEY_FILE: /secrets/cluster-key
  SIGNING_KEY_FILE: /secrets/signing-key
  ENCRYPTION_KEY_FILE: /secrets/encryption-key

services:
  control:
    image: dfsha-controlnode:aws
    build: {context: ../.., dockerfile: docker/controlnode.Dockerfile}
    # Red del host: los nodos se hablan por la IP privada de cada VM.
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *security
      NODE_ID: ${CN_ID:?falta CN_ID}
      CN_ADDR: ${PRIVATE_IP:?falta PRIVATE_IP}:8000
      RAFT_ADDR: ${PRIVATE_IP}:9000
      RAFT_ADVERTISE: ${PRIVATE_IP}:9000
      CN_PEERS: ${CN_PEERS:?falta CN_PEERS}
      USERS_FILE: /secrets/users.json
      METADATA_DIR: /metadata
      REPLICATION_FACTOR: ${REPLICATION_FACTOR:-2}
      REBALANCE_THRESHOLD_PERCENT: ${REBALANCE_THRESHOLD_PERCENT:-10}
    volumes:
      - ${SECRETS_DIR:-../../.secrets}:/secrets:ro
      - ${DATA_ROOT:-/var/lib/dfsha}/control:/metadata
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --ca-certificate=/secrets/ca.crt, "https://${PRIVATE_IP}:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  data:
    image: dfsha-datanode:aws
    build: {context: ../.., dockerfile: docker/datanode.Dockerfile}
    network_mode: host
    restart: unless-stopped
    environment:
      <<: *security
      NODE_ID: ${DN_ID:?falta DN_ID}
      DN_ADDR: ${PRIVATE_IP}:8001
      ADVERTISE_URL: https://${PRIVATE_IP}:8001
      CONTROL_URLS: ${CONTROL_URLS:?falta CONTROL_URLS}
      STORAGE_DIR: /data
      CAPACITY_BYTES: ${CAPACITY_BYTES:-1073741824}
    volumes:
      - ${SECRETS_DIR:-../../.secrets}:/secrets:ro
      - ${DATA_ROOT:-/var/lib/dfsha}/blocks:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, --ca-certificate=/secrets/ca.crt, "https://${PRIVATE_IP}:8001/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
